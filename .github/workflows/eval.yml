name: eval

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'vellum-app/src/ai/**'
      - 'vellum-app/evals/**'
      - 'vellum-app/package.json'
  workflow_dispatch:

jobs:
  claim-detector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vellum-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'vellum-app/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - name: Run claim-detector eval
        run: pnpm eval
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Regression gate
        # Scores the gold set and fails this job when any score falls more than
        # 0.05 below evals/baseline.json. With no baseline committed, the first
        # run writes one from real scores and passes.
        run: pnpm eval:gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
